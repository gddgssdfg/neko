[plugin]
id = "com.lantern.weather"
name = "天气"
version = "0.1.0"
api = 1
entry = "Weather.dll"
author = "lantern"
description = "天气速报：右键菜单查询佛山当前天气（Open-Meteo 免费 API，无需 key）"

[permissions]
pet = ["animate"]
ui = ["register"]
storage = ["local"]
other = ["network"]

[ui]
radial = true
settings = true

[resources]
maxMemoryMB = 16
