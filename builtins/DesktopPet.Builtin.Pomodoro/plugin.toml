[plugin]
id = "com.lantern.pomodoro"
name = "番茄钟"
version = "0.2.0"
api = 1
entry = "Pomodoro.dll"
author = "lantern"
description = "专注与休息计时：支持暂停、锁屏暂停和待办联动"

[permissions]
pet = ["animate"]
ui = ["register"]
storage = ["local"]
other = ["scheduler", "notify"]

[ui]
radial = true
settings = true

[resources]
maxMemoryMB = 16
